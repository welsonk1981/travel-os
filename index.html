<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f7fa8"><title>Travel OS</title><style>
:root{
  --bg:#f7f6f2;
  --card:#ffffff;
  --text:#243746;
  --sub:#66717a;
  --line:#e7e9e8;
  --blue:#4f7fa8;
  --blue-soft:#eaf2f8;
  --green:#5b8b71;
  --green-soft:#e9f2ec;
  --amber:#a9783f;
  --amber-soft:#f6eee2;
  --gray-soft:#f1f3f5;
  --shadow:0 10px 28px rgba(44,57,72,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  font-size:16px;
  line-height:1.5;
}
button,a{font:inherit}
.app{max-width:820px;margin:0 auto;padding:16px 14px 118px}
.hero{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  box-shadow:var(--shadow);
}
.hero-top{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:flex-start;
}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--sub)}
h1{margin:4px 0 4px;font-size:30px}
.sub{font-size:15px;color:var(--sub)}
.version-meta{margin-top:5px;font-size:12px;color:var(--sub)}
.countdown{
  min-width:106px;
  background:var(--blue-soft);
  color:var(--blue);
  border-radius:16px;
  padding:10px 13px;
  text-align:right;
}
.countdown strong{display:block;font-size:24px}
.countdown span{font-size:12px}
.weather{
  margin-top:14px;
  border:1px solid var(--line);
  background:#fafcff;
  border-radius:16px;
  padding:13px;
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:center;
}
.weather-main{display:flex;align-items:center;gap:10px}
.weather-icon{font-size:30px}
.weather-temp{font-size:24px;font-weight:800}
.weather-meta{text-align:right;font-size:13px;color:var(--sub)}
.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:14px 0 8px;
  position:sticky;
  top:0;
  z-index:5;
  background:linear-gradient(var(--bg) 78%,transparent);
}
.tab{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:999px;
  padding:9px 14px;
  white-space:nowrap;
  cursor:pointer;
}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.panel{display:none}
.panel.active{display:block}
.card,.day-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  margin:12px 0;
  padding:17px;
  box-shadow:var(--shadow);
}
.day-list{
  display:grid;
  gap:10px;
}
.day-preview{
  border:1px solid var(--line);
  background:#fff;
  border-radius:18px;
  padding:15px;
  cursor:pointer;
}
.day-preview:hover{border-color:#c8d7e4}
.preview-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}
.preview-day{display:flex;align-items:baseline;gap:8px;line-height:1.2}
.preview-day-label{font-size:14px;color:var(--blue);font-weight:800;letter-spacing:.02em}
.preview-date{font-size:21px;color:var(--text);font-weight:900}
.preview-route{font-size:21px;font-weight:850;margin-top:4px}
.hotel-chip{
  background:var(--blue-soft);
  color:var(--blue);
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
  white-space:nowrap;
}
.preview-points{
  margin-top:10px;
  color:#4f5760;
  font-size:13px;
}
.day-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  padding-bottom:13px;
  border-bottom:1px solid var(--line);
}
.day-label{font-size:12px;color:var(--sub)}
.route{font-size:22px;font-weight:900;margin-top:2px}
.stop{
  display:grid;
  grid-template-columns:108px minmax(0,1fr);
  gap:16px;
  padding:17px 0;
  border-bottom:1px dashed var(--line);
}
.stop:last-child{border-bottom:none}
.stop-top{
  display:block;
}
.place-title{font-size:19px;font-weight:850}
.place-title a{color:var(--text);text-decoration:none}
.stop-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.stop-option{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;padding:5px 8px;color:var(--text);background:var(--blue-soft);font-size:15px}
.arrival{
  grid-column:1;
  grid-row:1;
  font-size:15px;
  color:#7c858f;
  font-weight:750;
  white-space:nowrap;
  padding-top:1px;
}
.stop-content{
  grid-column:2;
  grid-row:1;
  min-width:0;
}
.secondary-stop{margin:0;border:0;border-radius:0;background:transparent;overflow:visible;box-shadow:none}
.secondary-stop::before{content:none}
.secondary-stop summary{display:flex;align-items:center;gap:8px;min-height:24px;padding:0;cursor:pointer;list-style:none}
.secondary-stop summary::-webkit-details-marker{display:none}
.secondary-stop summary::after{content:"⌄";margin-left:auto;color:#8a949d;font-size:15px;font-weight:900}
.secondary-stop[open] summary::after{content:"⌃"}
.secondary-stop-label{display:inline-flex;flex:0 0 auto;padding:3px 7px;border-radius:999px;background:#e9eef2;color:#63737f;font-size:11px;font-weight:850}
.secondary-stop .place-title{font-size:19px;color:var(--text)}
.secondary-stop-body{margin-top:10px;padding:0;border-top:1px dashed var(--line)}
.secondary-stop-body .place-note{margin-top:10px;line-height:1.65}
.flow-list{display:grid;margin-top:10px;padding:2px 0}
.flow-row{position:relative;display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding:7px 0 7px 19px}
.flow-row::before{content:"";position:absolute;left:4px;top:14px;width:7px;height:7px;border-radius:50%;background:#91a5b3;box-shadow:0 0 0 3px #f4f7f8}
.flow-row::after{content:"";position:absolute;left:7px;top:24px;bottom:-7px;width:1px;background:#dce4e8}
.flow-row:last-child::after{display:none}
.flow-time{color:#788791;font-size:12px;font-weight:800;white-space:nowrap;text-align:left;line-height:1.65}
.flow-text{color:#273640;font-size:16px;font-weight:750;line-height:1.5;min-width:0}
.flow-number{display:inline-block;font-size:17px;font-weight:900;line-height:1;vertical-align:-.02em}
.flow-text a{color:inherit;text-decoration:none}
.flow-text a:hover{color:#1769aa}
.flow-text a::after{content:" ↗";color:#8a9aa5;font-size:11px;font-weight:700}
.flow-text a .external-arrow{display:none}
.place-note{font-size:15px;color:var(--sub);margin-top:3px}
.metrics{
  display:flex;
  gap:0;
  flex-wrap:wrap;
  margin-top:7px;
  color:#8a929b;
  font-size:12px;
}
.metric{
  font-size:12px;
  font-weight:500;
  padding:0;
  border-radius:0;
  background:transparent!important;
  color:#8a929b!important;
}
.metric + .metric::before{
  content:"｜";
  color:#c1c6cc;
  margin:0 7px;
}
.area-list{margin-top:14px}
.compact-options{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--line);
}
.compact-options-title{
  margin-bottom:2px;
  color:var(--text);
  font-size:17px;
  font-weight:850;
}
.compact-option-row{
  display:grid;
  grid-template-columns:150px minmax(0,1fr);
  gap:14px;
  padding:11px 0;
  border-bottom:1px dashed var(--line);
}
.compact-option-row:last-child{border-bottom:0}
.compact-option-label{color:var(--sub);font-size:14px;font-weight:750}
.compact-option-links{font-size:15px;line-height:1.65}
.compact-option-links a{color:var(--text);font-weight:800;text-decoration:none}
.compact-option-separator{margin:0 7px;color:#b0b6bb}
.area-card{
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
  margin-top:9px;
}
.area-card.group-meal{border-left:5px solid #c78945;background:#fffaf3}
.area-card.group-pharmacy{border-left:5px solid #5b82b2;background:#f7faff}
.area-card.group-convenience{border-left:5px solid #5b8b71;background:#f7fbf8}
.area-card.group-shopping{border-left:5px solid #8469aa;background:#faf8fd}
.area-card.group-dessert{border-left:5px solid #c9798c;background:#fff8fa}
.area-card.group-essentials{border-left:5px solid #567b9e;background:#f7fafc}
.area-card.group-essentials .shop{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  margin-top:11px;
}
.shop-type{
  display:inline-flex;
  align-items:center;
  color:#4f6273;
  background:#edf2f6;
  border-radius:999px;
  padding:4px 9px;
  margin-bottom:7px;
  font-size:13px;
  font-weight:850;
}
.area-card summary{
  cursor:pointer;
  font-weight:800;
}
.area-subhead{
  margin:16px 0 3px;
  padding-left:9px;
  border-left:3px solid #7893a6;
  color:#334b5d;
  font-size:14px;
  font-weight:900;
}
.area-subhead:first-child{margin-top:12px}
.area-subnote{margin:0 0 6px 12px;color:var(--sub);font-size:12px}
.area-note{font-size:12px;color:var(--sub);margin-top:3px}
.place-guide{margin-top:9px;border:1px solid var(--line);border-radius:18px;padding:14px;background:#fbfcfd}
.place-guide-title{margin-bottom:4px;color:#16232d;font-size:18px;font-weight:900}
.place-guide-item{border:1px solid #dce4ea;border-left:5px solid #8469aa;border-radius:15px;background:#fff;overflow:hidden}
.place-guide-item summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;list-style:none}
.place-guide-item summary::-webkit-details-marker{display:none}
.place-guide-item summary::after{content:"⌄";color:#617b8d;font-size:15px;font-weight:900}
.place-guide-item[open] summary::after{content:"⌃"}
.place-guide-number{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#405f75;color:#fff;font-size:14px;font-weight:900}
.place-guide-heading{min-width:0}
.place-guide-name{display:block;color:#1769aa;font-size:17px;font-weight:900;line-height:1.35}
.place-guide-name-row{display:flex;align-items:center;gap:7px;min-width:0}
.place-guide-name-row .place-guide-name{min-width:0}
.place-guide-direct{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px;padding:13px 14px}
.place-guide-direct-note{margin-top:5px;color:#66717b;font-size:13px;font-weight:800}
.place-guide-time{display:block;margin-top:3px;color:#4e5862;font-size:13px;font-weight:850;white-space:nowrap}
.place-guide-body{padding:14px 14px 14px 18px;border-top:1px dashed #dce4ea;color:#596570;font-size:14px}
.place-guide-info{padding:10px 12px;border-radius:12px;background:#f7fafc;color:#4f5963;line-height:1.65}
.place-guide-info+.place-guide-info{margin-top:9px}
.place-guide-map-row{display:flex;align-items:center;margin-top:9px}
.place-guide-link{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid #b9cad7;border-radius:10px;background:#f5f9fc;color:#1769aa;text-decoration:none;font-size:17px;line-height:1}
.place-guide-link:hover{background:#eaf3f9;border-color:#8eafc5}
.place-guide-drive{display:flex;align-items:center;justify-content:center;padding:9px;color:#75818b;font-size:14px;font-weight:850}
.walk-guide{margin-top:9px;border:1px solid var(--line);border-radius:18px;padding:14px;background:#fbfcfd}
.walk-guide-title{color:#16232d;font-size:18px;font-weight:900}
.walk-guide-note{margin:4px 0 12px;color:var(--sub);font-size:13px}
.walk-shop{margin-top:10px;padding:13px 14px;border:1px solid #dce4ea;border-radius:15px;background:#fff}
.walk-shop:first-of-type{margin-top:0}
.walk-shop-name{display:flex;align-items:center;gap:7px;color:#1769aa;font-size:17px;font-weight:900;line-height:1.4}
.walk-shop-inline-link{color:#1769aa;text-decoration:none;font-size:17px;font-weight:900;line-height:1.4}
.walk-shop-inline-link:hover{text-decoration:underline}
.walk-shop-desc{display:flex;align-items:flex-start;gap:7px;margin-top:6px;color:#596570;font-size:14px;line-height:1.55}
.walk-shop-desc-text{min-width:0}
.walk-shop-meta{margin-top:7px}
.walk-shop-tag{display:inline-flex;flex:0 0 auto;padding:2px 7px;border-radius:999px;background:#edf2f6;color:#5d6c78;font-size:11px;font-weight:850}
.walk-shop-hours{color:#6d7780;font-size:13px;font-weight:700}
.walk-shop-map{display:inline-grid;flex:0 0 auto;place-items:center;width:25px;height:25px;border:1px solid #b9cad7;border-radius:8px;background:#f5f9fc;text-decoration:none;font-size:14px;line-height:1}
.walk-shop-actions{display:flex;align-items:center;gap:7px;margin-left:auto}
.walk-shop-parking{display:inline-grid;flex:0 0 auto;place-items:center;width:25px;height:25px;border:1px solid #c8b98c;border-radius:8px;background:#fffaf0;text-decoration:none;font-size:14px;line-height:1}
.compact-place-card{margin-top:10px;padding:14px 15px;border:1px solid #dce4ea;border-left:4px solid #8469aa;border-radius:15px;background:#fff}
.compact-place-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.compact-place-name{color:#1769aa;font-size:17px;font-weight:900;line-height:1.35}
.compact-place-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;color:#5f6972;font-size:13px;font-weight:800}
.compact-place-hours{color:#66717a;font-weight:700}
.hierarchy-area{border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:9px}
.hierarchy-area>summary{cursor:pointer;font-weight:800}
.hierarchy-list{padding-top:6px}
.hierarchy-group{padding:15px 0;border-bottom:1px solid #edf0f2}
.hierarchy-group:last-child{border-bottom:0;padding-bottom:2px}
.hierarchy-category{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;background:#edf2f6;color:#677580;font-size:11px;font-weight:850}
.hierarchy-place{margin-top:7px}
.hierarchy-name-row{display:flex;align-items:center;gap:10px}
.hierarchy-name{color:#1769aa;text-decoration:none;font-size:17px;font-weight:900;line-height:1.35}
.hierarchy-map{display:inline-grid;place-items:center;flex:0 0 auto;width:28px;height:28px;border:1px solid #b9cad7;border-radius:8px;background:#f5f9fc;text-decoration:none;font-size:14px}
.hierarchy-summary{margin-top:4px;color:#68737d;font-size:14px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hierarchy-hours{margin-top:6px;color:#505a65;font-size:13px;font-weight:750}
.hierarchy-choice-title{margin-top:7px;color:#334b5d;font-size:16px;font-weight:900}
.hierarchy-choice{padding:11px 0;border-top:1px dashed #e1e5e8}
.hierarchy-choice:first-of-type{border-top:0;padding-top:8px}
.hierarchy-badge{display:inline-flex;padding:3px 8px;border-radius:999px;background:#f0edf7;color:#705791;font-size:11px;font-weight:850;margin-bottom:5px}
.numbered-area{counter-reset:area-place}
.numbered-area .shop{position:relative;padding-left:38px}
.numbered-area .shop::before{counter-increment:area-place;content:counter(area-place);position:absolute;left:0;top:11px;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:900}
.coffee-guide{margin-top:11px;padding:11px 12px;border-radius:12px;background:#fff8fa}
.coffee-guide-title{color:#66737d;font-size:14px;font-weight:900}
.coffee-list{padding-top:4px}
.coffee-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px dashed #dfe5e9}
.coffee-item:first-child{border-top:0}
.coffee-item a{color:#1769aa;text-decoration:none;font-size:15px;font-weight:850}
.coffee-hours{color:#7b858d;font-size:13px;text-align:right}
.shop{
  padding:11px 0;
  border-bottom:1px dashed var(--line);
}
.shop:last-child{border-bottom:0}
.shop a{color:#1769aa;text-decoration:none;font-weight:850;font-size:17px}
.shop-name-row{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.shop-location{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;background:#edf2f6;color:#5d6c78;font-size:12px;font-weight:850;line-height:1.35}
.reservation-note{display:inline-flex;align-items:center;margin-left:7px;color:#8a929b;font-size:12px;font-weight:700;vertical-align:2px}
.shop p{margin:4px 0;color:var(--sub);font-size:15px}
.shop-hours{font-size:14px;color:#505a65;margin-top:4px;font-weight:700}
.burger-options{display:grid;gap:9px;margin-top:7px}
.burger-option{padding:9px 0;border-top:1px dashed var(--line)}
.burger-option:first-child{border-top:0;padding-top:0}
.burger-option a{display:inline-block}
.burger-option p{margin:3px 0 0}
.shop-alert{font-size:12px;color:#955f45;background:#f8eee9;border-radius:9px;padding:7px 9px;margin-top:7px}
.field-guide{
  margin-top:10px;
  border:1px solid #dce6ee;
  border-radius:12px;
  background:#f7fafc;
  overflow:hidden;
}
.field-guide summary{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  color:#46677f;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
  list-style:none;
}
.field-guide summary::-webkit-details-marker{display:none}
.field-guide summary::after{content:"⌄";font-size:16px;transition:transform .2s ease}
.field-guide[open] summary::after{transform:rotate(180deg)}
.guide-body{padding:0 12px 11px;border-top:1px dashed #dce6ee}
.guide-note{margin:9px 0 0;color:var(--sub);font-size:12px}
.guide-list{margin:8px 0 0;padding-left:19px;color:#4f5963;font-size:13px}
.guide-list li{margin:6px 0}
.guide-table{width:100%;border-collapse:collapse;margin-top:9px;font-size:12px}
.guide-table th,.guide-table td{padding:7px 5px;border-bottom:1px solid #e5ebf0;text-align:left;vertical-align:top}
.guide-table th{color:#526574;background:#eef4f7}
.route-area{margin-top:9px;border:1px solid var(--line);border-radius:18px;padding:14px;background:#fbfcfd}
.route-area-head{font-size:18px;font-weight:900}
.route-area-note{font-size:12px;color:var(--sub);margin-top:3px}
.route-strip{display:flex;align-items:center;gap:8px;margin:13px 0;padding:10px 12px;border-radius:12px;background:#edf4f8;color:#45677e;font-size:13px;font-weight:850}
.route-strip .arrow{color:#8ca1b0}
.route-stop-card{border:1px solid #dce4ea;border-radius:15px;background:#fff;overflow:hidden}
.route-stop-card.primary{border-left:5px solid #8469aa}
.route-stop-card.shoes{border-left:5px solid #567b9e}
.route-stop-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;cursor:pointer;list-style:none}
.route-stop-summary::-webkit-details-marker{display:none}
.route-stop-summary::after{content:"⌄";flex:0 0 auto;color:#617b8d;font-size:15px;font-weight:900}
.route-stop-card[open]>.route-stop-summary::after{content:"⌃"}
.route-stop-head{display:flex;align-items:flex-start;gap:10px;min-width:0}
.route-stop-number{display:grid;place-items:center;flex:0 0 29px;height:29px;border-radius:50%;background:#405f75;color:#fff;font-weight:900}
.route-stop-title{font-size:17px;font-weight:900;line-height:1.35}
.route-stop-title a{color:#1769aa;text-decoration:none}
.route-stop-badge{display:inline-block;margin-top:4px;padding:3px 7px;border-radius:999px;background:#f0edf7;color:#705791;font-size:11px;font-weight:850}
.route-stop-time{margin-top:3px;font-size:13px;font-weight:850;color:#4e5862}
.route-stop-body{padding:0 14px 14px;border-top:1px dashed #dce4ea}
.route-stop-desc{margin-top:4px;color:var(--sub);font-size:15px}

</style></head><body><main class="app">
  <section class="hero"><div class="hero-top"><div><div class="eyebrow">TRAVEL OS</div><h1></h1><div class="sub"></div><div class="version-meta">讀取 Master Database…</div></div><div class="countdown" id="countdown"><strong>計算中</strong><span>距離出發</span></div></div><div class="weather" id="weather"><div class="weather-main"><div class="weather-icon" id="weatherIcon">⌛</div><div><div class="weather-temp" id="weatherTemp">讀取中</div><div class="sub" id="weatherText">今日天氣</div></div></div><div class="weather-meta" id="weatherMeta"></div></div></section>
  <nav class="tabs"><button class="tab active" data-target="home">首頁</button><button class="tab" data-target="flights">航班</button><button class="tab" data-target="rental">租車</button><button class="tab" data-target="lodging">住宿</button><button class="tab" data-target="currency">匯率</button></nav>

  <section id="currency" class="panel"><article class="card"><h2 style="margin:0">💴 日圓匯率工具</h2><div class="currency-grid"><div class="currency-field"><label for="jpyAmount">日圓 JPY</label><input id="jpyAmount" type="number" inputmode="decimal" min="0" step="1" placeholder="例如 5000"></div><div class="currency-field"><label for="twdAmount">結果 TWD</label><input id="twdAmount" type="number" inputmode="decimal" readonly></div></div><div class="rate-row"><span>1 JPY =</span><input id="jpyRate" type="number" inputmode="decimal" min="0.001" step="0.0001" readonly><span>TWD</span><button class="rate-btn" id="refreshRate" type="button">更新</button></div><div class="quick-rates"><button type="button" data-jpy="1000">¥1,000</button><button type="button" data-jpy="3000">¥3,000</button><button type="button" data-jpy="5000">¥5,000</button><button type="button" data-jpy="10000">¥10,000</button></div><div class="rate-status" id="rateStatus" aria-live="polite"></div></article></section>
</main>
<nav class="footer" aria-label="主要導覽"><button class="active" data-target="home"><span>🗓️</span><small>行程總表</small></button><button data-target="flights"><span>✈️</span><small>航班</small></button><button data-target="rental"><span>🚗</span><small>租車</small></button><button data-target="lodging"><span>🏨</span><small>住宿</small></button><button data-target="currency"><span>¥</span><small>匯率</small></button></nav><script>
let travelDB=null;
let project=null;
let places=null;
let siteConfig=null;
let dayData={};
let mustDoByDate={};
const safeStorage={
  get(key){try{return safeStorage.get(key)}catch(e){return null}},
  set(key,value){try{localStorage.setItem(key,value)}catch(e){} }
};

const shortText=text=>(text||"").split(/[；。]/)[0].replace(/^(建議|主要|安排)/,"");
function formatFlowText(text){ return String(text||"").replace(/^([①-⑳])/,`<span class="flow-number">$1</span>`); }
function getPlace(id){ return places?.[id] || null; }
function displayName(p){ return p?.displayName || p?.name || ""; }

function itemToRow(item){
  if(item.kind==="uiReference"){
    const r=siteConfig.uiReferences?.[item.refId];
    return {refId:item.refId,row:[r.label||"",r.name||"",r.description||"",r.usage||"",r.url||"",r.displayGroup||""]};
  }
  if(item.kind==="choiceGroup"){
    const opts=item.choices.map(c=>{
      const p=getPlace(c.placeId);
      return [displayName(p),p?.description||"",p?.hours||"",p?.mapUrl||""];
    });
    return {row:["__BURGER__",item.title,opts]};
  }
  const p=getPlace(item.placeId);
  const d=item.display||{};
  const name=d.nameOverride || displayName(p);
  const row=[d.label||"",name,d.description??p?.description??"",d.hoursOverride??p?.hours??"",p?.mapUrl||"",d.displayGroup||"",d.guide??null,d.locationLabel||""];
  if(d.reservation) row.push(d.reservation);
  return {placeId:item.placeId,row};
}
function placeDisplayName(place,item={}){
  const style=item.display?.nameStyle;
  if(style && place.displayNames?.[style]) return place.displayNames[style];
  return place.displayName||place.name||place.id;
}
function roleLabel(item){
  if(item.visitRole==="must") return "必去";
  if(item.visitRole==="optional") return item.display?.optionalLabel||"可省略";
  if(item.visitRole==="backup") return "備用";
  return "";
}
function timelineItemText(item){
  if(item.type==="action") return item.text||"";
  if(item.type==="flight") return item.display?.text||"";
  if(item.type==="lodging"){
    const lodging=siteConfig.lodging.find(x=>x.date===item.lodgingDate);
    const base=(lodging?.name||"住宿").replace(/^🏨\s*/,"");
    return `${base}${item.display?.suffix||""}`;
  }
  if(item.type==="multiPlace"){
    const names=(item.placeIds||[]).map(id=>placeDisplayName(places[id]||{id},{display:{}})).join("、");
    return `${item.display?.prefix||""}${names}${item.display?.suffix||""}`;
  }
  if(item.type==="place"){
    const p=places[item.placeId]||{id:item.placeId,name:item.placeId};
    let text=`${item.display?.prefix||""}${placeDisplayName(p,item)}`;
    if(item.display?.showHours && p.hours) text+=`｜${item.display?.hoursPrefix||""}${p.hours}`;
    if(item.display?.suffix) text+=item.display.suffix;
    const role=roleLabel(item);
    if(role && item.display?.roleParenthetical) text+=`（${role}）`;
    if(role && item.display?.roleSuffix) text+=`｜${role}`;
    return text;
  }
  return "";
}
function timelineToStops(entries){
  return (entries||[]).map(entry=>{
    const stop={time:entry.time?.display||"",name:entry.type==="group"?(entry.title||""):timelineItemText(entry)};
    if(entry.collapsible) stop.collapsible=true;
    if(entry.note!==undefined) stop.note=entry.note;
    if(entry.stay!==undefined) stop.stay=entry.stay;
    if(entry.next!==undefined) stop.next=entry.next;
    if(entry.reservation!==undefined) stop.reservation=entry.reservation;
    if(entry.items) stop.steps=entry.items.map(item=>[item.time?.display||"",timelineItemText(item)]);
    return stop;
  });
}
function buildDayData(){
  const result={};
  Object.keys(project.itineraries).forEach(dayKey=>{
    const meta=project.dayMeta?.[dayKey]||{};
    const it=project.itineraries[dayKey];
    const areas=(project.displayGroups?.[dayKey]||[]).map(a=>{
      const out={...a}; delete out.items; delete out.id;
      out.shops=(a.items||[]).map(itemToRow);

    });
    result[dayKey]={...meta,route:it.route||"",stops:timelineToStops(it.timeline||[]),areas};
  });

}
