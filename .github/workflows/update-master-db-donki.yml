name: Update Master DB Donki Susukino

on:
  push:
    paths:
      - '.github/scripts/add_donki_susukino.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Master Database
        run: python .github/scripts/add_donki_susukino.py

      - name: Commit database update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master-database.json
          if git diff --cached --quiet; then
            echo "No database changes"
          else
            git commit -m "新增唐吉訶德薄野店至 Day 1 晚間採買"
            git push
          fi
