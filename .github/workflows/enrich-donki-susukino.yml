name: Enrich Don Quijote Susukino

on:
  push:
    paths:
      - '.github/scripts/enrich_donki_susukino.py'
      - '.github/workflows/enrich-donki-susukino.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enrich Master Database
        run: python .github/scripts/enrich_donki_susukino.py
      - name: Commit database update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master-database.json
          if git diff --cached --quiet; then
            echo "No database changes"
          else
            git commit -m "補齊唐吉訶德薄野店資料"
            git push
          fi
