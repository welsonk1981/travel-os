name: Publish Day 2

on:
  push:
    paths:
      - '.github/workflows/publish-day2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Master Database to website
        run: python .github/scripts/publish_day2.py

      - name: Verify HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              '札幌北側早晨',
              '琴似神社',
              '㈱マルサン三上商店／まるさん亭 本店',
              '北大マルシェ Café & Labo',
              '14:30–15:15',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing published values: {missing}')
          print('HTML verification passed')
          PY

      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/master-database.json
          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "發布 Day 2 札幌早晨行程"
            git push
          fi
