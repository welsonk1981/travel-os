name: Publish Travel OS Updates

on:
  push:
    paths:
      - '.github/workflows/publish-day2.yml'
      - '.github/scripts/publish_sapporo_night_parking.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply parking and business-hours updates
        run: python .github/scripts/publish_sapporo_night_parking.py

      - name: Verify HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'Parking（南3條西9丁目）',
              '遠藤興産㈱ 南３西７パーキング',
              '20:00–23:00 預估停車費 ¥800',
              '20:00–23:00 預估停車費 ¥1,400',
              '🌙 宵夜',
              '18:00–24:00（L.O.23:00）',
              '11:00–21:00（L.O.20:30）',
              '10:30–19:00',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing published values: {missing}')
          print('HTML verification passed')
          PY

      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/master-database.json
          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "發布札幌宵夜停車與營業時間更新"
            git push
          fi
