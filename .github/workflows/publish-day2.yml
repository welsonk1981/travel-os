name: Publish Travel OS Updates

on:
  push:
    paths:
      - '.github/workflows/publish-day2.yml'
      - '.github/scripts/publish_link_style_and_area_numbering.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply link style and area numbering updates
        run: python .github/scripts/publish_link_style_and_area_numbering.py

      - name: Verify HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              '${option[0]} ↗',
              '${shop[1]} ↗',
              'numbered:true',
              'numbered-area',
              'counter(area-place)',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing published values: {missing}')
          print('HTML verification passed')
          PY

      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/master-database.json
          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "發布區域連結樣式與洞爺湖自動編號"
            git push
          fi
