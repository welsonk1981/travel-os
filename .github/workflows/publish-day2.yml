name: Publish Day 2 UI

on:
  push:
    paths:
      - '.github/workflows/publish-day2.yml'
      - '.github/scripts/publish_day2_ui_v3.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply UI updates
        run: python .github/scripts/publish_day2_ui_v3.py

      - name: Verify HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'class="walk-shop-parking"',
              'layout:"compact-place"',
              'layout:"hierarchy"',
              'class="compact-place-card"',
              'class="hierarchy-category"',
              '札幌場外市場 共用免費停車場',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing published values: {missing}')
          print('HTML verification passed')
          PY

      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/master-database.json
          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "發布停車定位、頭大佛卡片與小樽資訊層次"
            git push
          fi
